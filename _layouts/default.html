<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Existing site CSS -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}">

  <style>

    /* ========================================
       GENERAL
       ======================================== */

    :root {
      --nav-color: #343b56;
      --nav-hover: #444d6c;
      --text-dark: #252832;
      --text-muted: #6b6f79;
      --page-bg: #f8f9fb;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-dark);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }


    /* ========================================
       HEADER
       ======================================== */

    .site-header {
      background: var(--nav-color);
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.10);
      position: relative;
      z-index: 1000;
    }

    .site-navbar {
      min-height: 82px;
      padding: 0;
    }

    /*
      Keeps both your name and navigation away
      from the extreme edges of the screen.
    */
    .nav-shell {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 46px;

      display: flex;
      align-items: center;
    }


    /* ========================================
       YOUR NAME
       ======================================== */

    .navbar-brand {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;

      color: var(--white) !important;
      text-decoration: none;

      margin-right: auto;
      padding: 0;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .navbar-brand:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }


    /* ========================================
       NAVIGATION
       ======================================== */

    .navbar-collapse {
      flex-grow: 0;
    }

    .navbar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar-nav .nav-link {
      position: relative;

      font-family: "Inter", sans-serif;
      font-size: 0.96rem;
      font-weight: 500;
      letter-spacing: 0.01em;

      color: rgba(255, 255, 255, 0.76) !important;

      padding: 10px 15px !important;
      border-radius: 7px;

      transition:
        color 0.2s ease,
        background-color 0.2s ease;
    }

    .navbar-nav .nav-link:hover {
      color: var(--white) !important;
      background: rgba(255, 255, 255, 0.08);
    }

    .navbar-nav .nav-link.active {
      color: var(--white) !important;
      font-weight: 600;
    }


    /* Small underline underneath active page */

    .navbar-nav .nav-link.active::after {
      content: "";
      position: absolute;

      left: 15px;
      right: 15px;
      bottom: 4px;

      height: 2px;
      border-radius: 10px;

      background: rgba(255, 255, 255, 0.9);
    }


    /* ========================================
       PROJECTS DROPDOWN
       ======================================== */

    .project-dropdown {
      position: relative;
    }

    /*
      Centers the dropdown underneath Projects.

      This fixes the problem where it was being
      pushed toward / off the right side.
    */

    .project-dropdown .dropdown-menu {
      display: block;

      position: absolute;

      top: calc(100% + 10px);
      left: 50%;
      right: auto;

      transform:
        translateX(-50%)
        translateY(8px);

      min-width: 285px;
      max-width: 360px;

      padding: 10px;

      background: rgba(255, 255, 255, 0.98);

      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 12px;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.16);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;
    }


    /* Invisible bridge prevents dropdown from closing
       when mouse moves down toward it */

    .project-dropdown::after {
      content: "";
      position: absolute;

      top: 100%;
      left: 0;

      width: 100%;
      height: 14px;
    }


    /* Open on hover */

    .project-dropdown:hover .dropdown-menu,
    .project-dropdown:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* Dropdown arrow */

    .dropdown-toggle::after {
      margin-left: 7px;
      vertical-align: 0.15em;

      transition: transform 0.2s ease;
    }

    .project-dropdown:hover .dropdown-toggle::after {
      transform: rotate(180deg);
    }


    /* Dropdown links */

    .project-dropdown .dropdown-item {
      padding: 11px 13px;

      border-radius: 8px;

      font-family: "Inter", sans-serif;
      font-size: 0.92rem;
      font-weight: 500;

      color: #34363d;

      white-space: normal;

      transition:
        background-color 0.15s ease,
        transform 0.15s ease,
        color 0.15s ease;
    }

    .project-dropdown .dropdown-item:hover {
      background: #f0f2f6;
      color: #202432;

      transform: translateX(3px);
    }


    /* View All Projects */

    .project-dropdown .view-all-projects {
      font-weight: 600;
      color: var(--nav-color);
    }


    /* Divider */

    .dropdown-divider {
      margin: 7px 4px;
      opacity: 0.12;
    }


    /* ========================================
       MAIN PAGE
       ======================================== */

    main.site-content {
      width: 100%;
      max-width: 1040px;

      margin: 0 auto;

      padding-top: 52px;
      padding-bottom: 60px;
      padding-left: 28px;
      padding-right: 28px;
    }


    /* Give headings a nicer editorial feel */

    main h1,
    main h2,
    main h3 {
      font-family: "Playfair Display", Georgia, serif;
      color: var(--text-dark);
    }

    main h1 {
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    main h2 {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    main p,
    main li {
      font-family: "Inter", sans-serif;
      line-height: 1.75;
    }


    /* Links */

    main a {
      text-underline-offset: 3px;
    }


    /* ========================================
       FOOTER
       ======================================== */

    .site-footer {
      background: var(--nav-color);

      color: rgba(255, 255, 255, 0.75);

      text-align: center;

      font-family: "Inter", sans-serif;
      font-size: 0.88rem;

      padding: 22px 20px;
    }


    /* ========================================
       MOBILE
       ======================================== */

    .navbar-toggler {
      border: 0;
      box-shadow: none !important;
    }

    @media (max-width: 991px) {

      .nav-shell {
        padding: 0 24px;
        flex-wrap: wrap;
      }

      .site-navbar {
        padding: 18px 0;
      }

      .navbar-brand {
        font-size: 1.55rem;
      }

      .navbar-collapse {
        width: 100%;

        margin-top: 16px;
        padding-top: 14px;

        border-top: 1px solid rgba(255,255,255,0.12);
      }

      .navbar-nav {
        align-items: stretch;
        gap: 3px;
      }

      .navbar-nav .nav-link {
        padding: 10px 8px !important;
      }

      .navbar-nav .nav-link.active::after {
        display: none;
      }


      /*
        On smaller screens the dropdown becomes
        part of the normal page flow rather than
        trying to float outside the screen.
      */

      .project-dropdown .dropdown-menu {
        position: static;

        transform: none;

        min-width: 100%;
        max-width: none;

        margin-top: 5px;

        box-shadow: none;

        opacity: 1;
        visibility: visible;
        pointer-events: auto;

        display: none;
      }

      .project-dropdown:hover .dropdown-menu,
      .project-dropdown:focus-within .dropdown-menu {
        display: block;
        transform: none;
      }

    }


    @media (max-width: 575px) {

      .nav-shell {
        padding-left: 18px;
        padding-right: 18px;
      }

      main.site-content {
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 38px;
      }

    }

  </style>

</head>


<body>


  <!-- ======================================
       HEADER
       ====================================== -->

  <header class="site-header">

    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">

      <div class="nav-shell">


        <!-- YOUR NAME -->

        <a
          class="navbar-brand"
          href="{{ '/' | relative_url }}">

          {{ site.title }}

        </a>


        <!-- MOBILE BUTTON -->

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation">

          <span class="navbar-toggler-icon"></span>

        </button>


        <!-- NAVIGATION -->

        <div
          class="collapse navbar-collapse"
          id="navbarNav">

          <ul class="navbar-nav">


            <!-- HOME -->

            <li class="nav-item">

              <a
                class="nav-link {% if page.url == '/' %}active{% endif %}"
                href="{{ '/' | relative_url }}">

                Home

              </a>

            </li>


            <!-- PROJECTS -->

            <li class="nav-item dropdown project-dropdown">

              <a
                class="nav-link dropdown-toggle {% if page.url contains '/projects/' %}active{% endif %}"
                href="{{ '/projects/' | relative_url }}">

                Projects

              </a>


              <ul class="dropdown-menu">


                <!-- ALL PROJECTS -->

                <li>

                  <a
                    class="dropdown-item view-all-projects"
                    href="{{ '/projects/' | relative_url }}">

                    View All Projects & Experience

                  </a>

                </li>


                <li>
                  <hr class="dropdown-divider">
                </li>


                <!-- AUTOMATIC PROJECT LIST -->

                {% assign sorted_projects = site.projects | sort: "title" %}

                {% for project in sorted_projects %}

                  <li>

                    <a
                      class="dropdown-item"
                      href="{{ project.url | relative_url }}">

                      {{ project.title }}

                    </a>

                  </li>

                {% endfor %}


              </ul>

            </li>


            <!-- RESUME -->

            <li class="nav-item">

              <a
                class="nav-link {% if page.url == '/cv/' %}active{% endif %}"
                href="{{ '/cv/' | relative_url }}">

                Resume

              </a>

            </li>


          </ul>

        </div>

      </div>

    </nav>

  </header>



  <!-- ======================================
       PAGE CONTENT
       ====================================== -->

  <main class="site-content">

    {{ content }}

  </main>



  <!-- ======================================
       FOOTER
       ====================================== -->

  <footer class="site-footer">

    © 2026 {{ site.name }}. All rights reserved.

  </footer>



  <!-- BOOTSTRAP JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>


</body>

</html>
