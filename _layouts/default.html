<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">

  <!-- Your custom stylesheet -->
  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Navigation dropdown styling -->
  <style>

    /* Make dropdown open when hovering over Projects */
    .project-dropdown:hover .dropdown-menu,
    .project-dropdown:focus-within .dropdown-menu {
      display: block;
    }

    /* Prevent small gap between Projects and dropdown */
    .project-dropdown .dropdown-menu {
      margin-top: 0;
    }

    /* Dropdown appearance */
    .project-dropdown .dropdown-menu {
      min-width: 260px;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    /* Dropdown project links */
    .project-dropdown .dropdown-item {
      padding: 10px 14px;
      border-radius: 6px;
    }

    /* Hover effect on projects */
    .project-dropdown .dropdown-item:hover {
      background-color: #f1f1f1;
    }

    /* Keep dropdown above page content */
    .navbar {
      position: relative;
      z-index: 1000;
    }

  </style>

</head>


<body>

  <!-- HEADER / NAVIGATION -->
  <header>

    <nav class="navbar navbar-expand-lg navbar-dark text-white">

      <div class="container-fluid">

        <!-- Your name / logo -->
        <a
          class="navbar-brand"
          href="{{ '/' | relative_url }}">
          {{ site.title }}
        </a>


        <!-- Mobile menu button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation">

          <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navigation Links -->
        <div
          class="collapse navbar-collapse"
          id="navbarNav">

          <ul class="navbar-nav ms-auto">


            <!-- HOME -->
            <li class="nav-item">

              <a
                class="nav-link {% if page.url == '/' %}active{% endif %}"
                href="{{ '/' | relative_url }}">

                Home

              </a>

            </li>


            <!-- PROJECTS DROPDOWN -->
            <li class="nav-item dropdown project-dropdown">

              <a
                class="nav-link dropdown-toggle {% if page.url contains '/projects/' %}active{% endif %}"
                href="{{ '/projects/' | relative_url }}"
                id="projectsDropdown"
                aria-expanded="false">

                Projects

              </a>


              <ul
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="projectsDropdown">


                <!-- View all projects -->
                <li>

                  <a
                    class="dropdown-item fw-bold"
                    href="{{ '/projects/' | relative_url }}">

                    View All Projects

                  </a>

                </li>


                <li>
                  <hr class="dropdown-divider">
                </li>


                <!-- Automatically get every project -->
                {% assign sorted_projects = site.projects | sort: "title" %}

                {% for project in sorted_projects %}

                  <li>

                    <a
                      class="dropdown-item"
                      href="{{ project.url | relative_url }}">

                      {{ project.title }}

                    </a>

                  </li>

                {% endfor %}


              </ul>

            </li>


            <!-- RESUME -->
            <li class="nav-item">

              <a
                class="nav-link {% if page.url == '/cv/' %}active{% endif %}"
                href="{{ '/cv/' | relative_url }}">

                Resume

              </a>

            </li>


          </ul>

        </div>

      </div>

    </nav>

  </header>


  <!-- PAGE CONTENT -->
  <main class="container">

    {{ content }}

  </main>


  <!-- FOOTER -->
  <footer class="footer navbar-dark text-white text-center">

    <div class="container">

      &copy; 2026 {{ site.name }}. All rights reserved.

    </div>

  </footer>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
